name: 🐛 Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start LibreHardwareMonitor
        2. Run `npm start`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AeroPulse Pro version
      placeholder: v1.4.0
    validations:
      required: true
  - type: input
    id: lhm
    attributes:
      label: LibreHardwareMonitor version
      placeholder: v0.9.6 (.NET 10)
  - type: input
    id: env
    attributes:
      label: Environment
      description: Windows version and Node.js version (`node -v`)
      placeholder: Windows 11 24H2, Node v24.1.0
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: CPU, GPU, motherboard (sensor mapping depends on it)
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
